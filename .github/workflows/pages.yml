name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply repo variables to config.js (only the ones that are set)
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ICON_URL: ${{ vars.APP_ICON_URL }}
        run: |
          node -e '
            const fs = require("fs");
            let s = fs.readFileSync("config.js", "utf8");
            const set = (key, val) => {
              if (val) s = s.replace(new RegExp(key + ":\\s*\"[^\"]*\""), key + ": " + JSON.stringify(val));
            };
            set("appName", process.env.APP_NAME);
            set("appIcon", process.env.APP_ICON_URL);
            fs.writeFileSync("config.js", s);
          '
          cat config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
